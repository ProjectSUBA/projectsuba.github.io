<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="SUBA — Sustainable Urban and Bioregional Action">
  <title>SUBA</title>
  <!-- Mark -->
  <g transform="translate(0,2)">
    <!-- Yellow arc / sun arch -->
    <path d="M 5 28 Q 12 6 26 9 Q 37 12 42 22" stroke="#FEC110" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- Sun orb -->
    <circle cx="36" cy="15" r="4" fill="#F6A225"/>
    <!-- Monolith crown on sun -->
    <rect x="33.5" y="10" width="1.2" height="4" rx="0.5" fill="#1A5C2E"/>
    <rect x="35.5" y="8.5" width="1.2" height="5.5" rx="0.5" fill="#1A5C2E"/>
    <rect x="37.5" y="10.5" width="1.2" height="3.5" rx="0.5" fill="#1A5C2E"/>
    <!-- Blue wing / body -->
    <path d="M 6 35 Q 12 22 27 21 Q 38 21 43 31 Q 36 36 26 33 Q 16 31 6 35Z" fill="#1F8EC8" opacity="0.92"/>
    <!-- Green lower sweep -->
    <path d="M 4 38 Q 12 28 24 32 Q 34 36 44 29 Q 48 39 40 45 Q 28 51 16 45 Q 5 40 4 38Z" fill="#259745"/>
    <!-- Dark green outer arc -->
    <path d="M 3 33 Q 4 50 26 53 Q 46 50 48 33" stroke="#1A5C2E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- Beak -->
    <path d="M 43 27 L 49 24 L 47 29Z" fill="#FEC110"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="32" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1A5C2E" letter-spacing="3">SUBA</text>
  <text x="59" y="44" font-family="'Courier New', monospace" font-size="5.5" fill="#4A4A40" letter-spacing="1.5">SUSTAINABLE · URBAN · BIOREGIONAL · ACTION</text>
</svg>
