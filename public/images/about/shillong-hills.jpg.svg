<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#259745" opacity="1.0"/>
  <!-- Subtle texture pattern -->
  <defs>
    <pattern id="p" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#p)"/>
  <!-- Camera icon -->
  <g transform="translate(576,310)">
    <rect x="0" y="8" width="48" height="34" rx="4" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <circle cx="24" cy="25" r="9" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <circle cx="24" cy="25" r="4" fill="white" opacity="0.2"/>
    <rect x="14" y="4" width="10" height="7" rx="2" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Label -->
  <text x="600" y="370" font-family="'Courier New', monospace" font-size="11" fill="white" opacity="0.5" text-anchor="middle" letter-spacing="2">SHILLONG HILLS</text>
  <text x="600" y="387" font-family="Georgia, serif" font-size="9" fill="white" opacity="0.3" text-anchor="middle">Landscape photography · Khasi Hills</text>
  <!-- Dimensions -->
  <text x="600" y="688" font-family="'Courier New', monospace" font-size="8" fill="white" opacity="0.2" text-anchor="middle">1200 × 700</text>
</svg>